<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nutrition Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FAF7F2;
    --paper-raised: #FFFFFF;
    --ink: #2B2622;
    --ink-soft: #6B6259;
    --line: #DDD6CB;
    --sage: #5C6E4F;
    --sage-bg: #EAEDE4;
    --amber: #B8863C;
    --amber-bg: #F5EBD8;
    --brick: #A34F3F;
    --brick-bg: #F3E4E0;
    --disabled: #C9C2B8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  h1, h2, h3, .serif { font-family: 'Newsreader', serif; }

  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar (navigation only) ---------- */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--paper-raised);
    border-right: 1px solid var(--line);
    padding: 28px 22px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 4px; }
  .sidebar .subtitle { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 20px; }

  .print-btn {
    width: 100%;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper-raised);
    border-radius: 5px;
    cursor: pointer;
    margin-bottom: 22px;
  }
  .print-btn:hover { opacity: 0.85; }

  .month-block { margin-bottom: 26px; }
  .month-title { font-size: 0.95rem; font-weight: 600; margin: 0 0 10px; }
  .weekday-row, .week-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .weekday-row { margin-bottom: 4px; }
  .weekday-row span { font-size: 0.68rem; color: var(--ink-soft); text-align: center; }
  .week-row { margin-bottom: 3px; }
  .day-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    border-radius: 5px;
    border: 1px solid transparent;
    cursor: pointer;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
  }
  .day-cell.empty { visibility: hidden; }
  .day-cell.no-data { color: var(--disabled); cursor: default; }
  .day-cell.has-data { border-color: var(--line); font-weight: 500; }
  .day-cell.has-data:hover { border-color: var(--sage); }
  .day-cell.active-day {
    background: var(--sage);
    border-color: var(--sage);
    color: #fff;
    font-weight: 600;
  }

  .legend {
    margin-top: 18px;
    font-size: 0.72rem;
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .legend span.swatch {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: middle;
  }

  /* ---------- Main content: continuous scroll ---------- */
  .main { flex: 1; padding: 40px 48px 80px; max-width: 760px; }
  .main-header { margin-bottom: 36px; }
  .main-header h2 { font-size: 1.7rem; font-weight: 600; margin: 0 0 6px; }
  .main-header p { color: var(--ink-soft); margin: 0; font-size: 0.92rem; }

  .day-block {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 26px 28px;
    margin-bottom: 22px;
    scroll-margin-top: 24px;
  }
  .day-block-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .day-date { font-size: 1.2rem; font-weight: 600; margin: 0; }
  .day-note { font-size: 0.72rem; color: var(--amber); margin: 0 0 16px; }

  .meal-group {
    display: grid;
    grid-template-columns: 58px 1fr;
    column-gap: 10px;
    margin-bottom: 10px;
  }
  .meal-label {
    grid-column: 1;
    grid-row: 1 / -1;
    align-self: start;
    padding-top: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ink-soft);
    line-height: 1.3;
  }
  .meal-label .meal-cal { display: block; font-weight: 400; }
  .meal-items { grid-column: 2; }
  .item-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    font-size: 0.88rem;
    border-bottom: 1px solid #F0ECE4;
  }
  .item-row:last-child { border-bottom: none; }
  .item-name { color: var(--ink); }
  .item-meta { color: var(--ink-soft); white-space: nowrap; margin-left: 14px; }

  .summary-compact {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .summary-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }
  .summary-row + .summary-row {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #F0ECE4;
  }
  .metric-cell {
    padding: 0 10px;
    border-right: 1px solid #F0ECE4;
  }
  .metric-cell:last-child { border-right: none; }
  .metric-cell:first-child { padding-left: 0; }
  .metric-label { font-size: 0.6rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.3px; }
  .metric-value { font-size: 0.88rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .metric-dot { font-family: Arial, sans-serif; font-size: 18px; line-height: 1; margin-left: 5px; vertical-align: middle; }
  .dot-ok { color: #3DDC84; }
  .dot-low { color: #FFC700; }
  .dot-high { color: #FF3B30; }
  .metric-dot::before { content: '\25CF'; }
  .metric-target { font-size: 0.6rem; color: var(--ink-soft); }

  .cal-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-left: 12px;
  }

  /* ---------- Print-scope modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(43,38,34,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--paper-raised);
    border-radius: 10px;
    padding: 28px 30px;
    width: 780px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  .modal .modal-sub { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 18px; }
  .modal-bulk { display: flex; gap: 8px; margin-bottom: 18px; }
  .modal-bulk button {
    flex: 1; font-family: inherit; font-size: 0.8rem; font-weight: 600;
    padding: 8px 4px; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink); border-radius: 5px; cursor: pointer;
  }
  .modal-calendars { display: flex; gap: 24px; }
  .modal-calendars .month-block { flex: 1; margin-bottom: 0; }
  .modal-week-row {
    display: grid;
    grid-template-columns: 18px repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 3px;
    align-items: center;
  }
  .week-toggle {
    width: 16px; height: 16px;
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--paper); cursor: pointer; padding: 0;
  }
  .week-toggle:hover { border-color: var(--sage); }
  .day-cell.selected { background: var(--sage); border-color: var(--sage); color: #fff; font-weight: 600; }

  .modal-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line);
  }
  .modal-footer .count { font-size: 0.8rem; color: var(--ink-soft); }
  .modal-footer .actions { display: flex; gap: 10px; }
  .btn-secondary, .btn-primary {
    font-family: inherit; font-size: 0.85rem; font-weight: 600;
    padding: 9px 16px; border-radius: 5px; cursor: pointer;
  }
  .btn-secondary { background: var(--paper); border: 1px solid var(--line); color: var(--ink); }
  .btn-primary { background: var(--ink); border: 1px solid var(--ink); color: var(--paper-raised); }

  /* ---------- Print ---------- */
  @page { margin: 0.5in; }
  @media print {
    .sidebar, .modal-overlay, .main-header { display: none !important; }
    .main { max-width: 100%; padding: 0; }
    .day-block { break-inside: avoid; border: none; border-bottom: none; border-radius: 0; }
    .day-block.print-exclude { display: none !important; }
    .day-block.page-break-before { break-before: page; }
    body { background: #fff; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <h1>Nutrition Report</h1>
    <p class="subtitle">Aug 21 &ndash; Sep 18, 2026</p>

    <button class="print-btn" onclick="openPrintModal()">Print / Export&hellip;</button>

    <div id="navCalendars"></div>

    <div class="legend">
      <div><span class="swatch" style="background:var(--sage)"></span>Day currently in view</div>
      <div><span class="swatch" style="border:1px solid var(--line)"></span>Has data</div>
      <div><span class="swatch" style="color:var(--disabled)">&middot;</span>No entries logged</div>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <h2>Daily detail</h2>
      <p>Scroll to browse every logged day. Use &ldquo;Print / Export&rdquo; to choose which days to print.</p>
    </div>
    <div id="dayList"></div>
  </main>
</div>

<div class="modal-overlay" id="printModal">
  <div class="modal">
    <h3>Choose days to print</h3>
    <p class="modal-sub">Browsing is unaffected &mdash; this only sets what gets printed.</p>

    <div class="modal-bulk">
      <button onclick="printSelectAll()">Select all</button>
      <button onclick="printSelectNone()">Select none</button>
    </div>

    <div class="modal-calendars" id="modalCalendars"></div>

    <div class="modal-footer">
      <span class="count" id="printCount"></span>
      <div class="actions">
        <button class="btn-secondary" onclick="closePrintModal()">Cancel</button>
        <button class="btn-primary" onclick="doPrint()">Print selected</button>
      </div>
    </div>
  </div>
</div>

const GOALS = {
  cal:     { label: 'Calories', unit: 'kcal', min: 1450, max: 1550 },
  fat:     { label: 'Fat',      unit: 'g',    min: 33,   max: 58   },
  sodium:  { label: 'Sodium',   unit: 'mg',   min: 1000, max: 2000 },
  carb:    { label: 'Carbs',    unit: 'g',    min: 169,  max: 244  },
  fiber:   { label: 'Fiber',    unit: 'g',    min: 27,   max: 33   },
  protein: { label: 'Protein',  unit: 'g',    min: 56,   max: 94   },
};

// Percent-of-calories thresholds, derived from the calorie GOAL's midpoint
// (1500 kcal) applied to each macro's own gram range -- matches the
// National Academy of Medicine's AMDR standard exactly for fat/carbs,
// and Dan's own personalized, narrower band for protein.
const PCT_GOALS = {
  fat:     { label: 'Fat (% Cal.)',     min: 20, max: 35 },
  carb:    { label: 'Carbs (% Cal.)',   min: 45, max: 65 },
  protein: { label: 'Protein (% Cal.)', min: 15, max: 25 },
};

// Computed from THIS day's own real macros (macro-derived total as the
// denominator), never from the logged calorie total -- matches Dan's
// established Numbers formula exactly, guaranteeing the three always
// sum to ~100% before rounding.
function computeMacroPercents(totals) {
  const fatCal = totals.fat * 9;
  const carbCal = totals.carb * 4;
  const proteinCal = totals.protein * 4;
  const denom = fatCal + carbCal + proteinCal;
  if (denom <= 0) return { fat: 0, carb: 0, protein: 0 };
  return {
    fat: Math.round(fatCal / denom * 100),
    carb: Math.round(carbCal / denom * 100),
    protein: Math.round(proteinCal / denom * 100),
  };
}

const allDates = Object.keys(DATA).sort();
let activeDate = allDates[0];
let printSelected = new Set(allDates); // defaults to everything, matching the "here's my two months" framing

function daysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }

// ---------- Shared month-grid builder ----------
// mode: 'nav'    -> click scrolls to day; single active-day highlight
// mode: 'select' -> click toggles printSelected; multi-select + week toggle
function buildMonthCalendar(year, month, monthName, mode) {
  const container = document.createElement('div');
  container.className = 'month-block';

  const title = document.createElement('div');
  title.className = 'month-title';
  title.textContent = monthName + ' ' + year;
  container.appendChild(title);

  const weekdayRow = document.createElement('div');
  weekdayRow.className = 'weekday-row';
  if (mode === 'select') weekdayRow.style.gridTemplateColumns = '18px repeat(7, 1fr)';
  weekdayRow.innerHTML = (mode === 'select' ? '<span></span>' : '') +
    ['S','M','T','W','T','F','S'].map(d => `<span>${d}</span>`).join('');
  container.appendChild(weekdayRow);

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const totalDays = daysInMonth(year, month);
  let dayNum = 1 - startWeekday;

  while (dayNum <= totalDays) {
    const weekRow = document.createElement('div');
    weekRow.className = mode === 'select' ? 'modal-week-row' : 'week-row';

    const weekDayNums = [];
    let toggleBtn = null;
    if (mode === 'select') {
      toggleBtn = document.createElement('button');
      toggleBtn.className = 'week-toggle';
      toggleBtn.title = 'Toggle this week';
      weekRow.appendChild(toggleBtn);
    }

    for (let i = 0; i < 7; i++) {
      const cell = document.createElement('button');
      const d = dayNum;
      if (d < 1 || d > totalDays) {
        cell.className = 'day-cell empty';
      } else {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const hasData = !!DATA[dateStr];
        cell.textContent = d;
        cell.className = 'day-cell ' + (hasData ? 'has-data' : 'no-data');
        if (hasData) {
          cell.dataset.date = dateStr;
          weekDayNums.push(dateStr);
          if (mode === 'nav') {
            if (dateStr === activeDate) cell.classList.add('active-day');
            cell.onclick = () => scrollToDay(dateStr);
          } else {
            if (printSelected.has(dateStr)) cell.classList.add('selected');
            cell.onclick = () => { toggleDayPrint(dateStr); };
          }
        }
      }
      weekRow.appendChild(cell);
      dayNum++;
    }

    if (mode === 'select') {
      toggleBtn.onclick = () => toggleWeekPrint(weekDayNums);
    }
    container.appendChild(weekRow);
  }

  return container;
}

// ---------- Navigation (sidebar) ----------
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function getWindowMonths() {
  const [sy, sm] = WINDOW_START.split('-').map(Number);
  const [ey, em] = WINDOW_END.split('-').map(Number);
  const months = [];
  let y = sy, m = sm;
  while (y < ey || (y === ey && m <= em)) {
    months.push([y, m - 1, MONTH_NAMES[m - 1]]);
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return months;
}

function renderNavCalendars() {
  const container = document.getElementById('navCalendars');
  container.innerHTML = '';
  getWindowMonths().forEach(([y, m, name]) => {
    container.appendChild(buildMonthCalendar(y, m, name, 'nav'));
  });
}

function scrollToDay(dateStr, instant = false) {
  const el = document.querySelector(`.day-block[data-date="${dateStr}"]`);
  if (el) el.scrollIntoView({ behavior: instant ? 'instant' : 'smooth', block: 'start' });
}

// ---------- Scrollspy ----------
let observer;
function setupScrollspy() {
  if (observer) observer.disconnect();
  observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const d = entry.target.dataset.date;
        if (d && d !== activeDate) {
          activeDate = d;
          renderNavCalendars();
        }
      }
    });
  }, { rootMargin: '0px 0px -70% 0px', threshold: 0 });

  document.querySelectorAll('.day-block').forEach(el => observer.observe(el));
}

// ---------- Print-scope modal ----------
function openPrintModal() {
  renderModalCalendars();
  document.getElementById('printModal').classList.add('open');
}
function closePrintModal() {
  document.getElementById('printModal').classList.remove('open');
}
function renderModalCalendars() {
  const container = document.getElementById('modalCalendars');
  container.innerHTML = '';
  getWindowMonths().forEach(([y, m, name]) => {
    container.appendChild(buildMonthCalendar(y, m, name, 'select'));
  });
  document.getElementById('printCount').textContent =
    `${printSelected.size} of ${allDates.length} days selected`;
}
function toggleDayPrint(dateStr) {
  if (printSelected.has(dateStr)) printSelected.delete(dateStr);
  else printSelected.add(dateStr);
  renderModalCalendars();
}
function toggleWeekPrint(dateStrs) {
  if (dateStrs.length === 0) return;
  const allSel = dateStrs.every(d => printSelected.has(d));
  dateStrs.forEach(d => allSel ? printSelected.delete(d) : printSelected.add(d));
  renderModalCalendars();
}
function printSelectAll() { printSelected = new Set(allDates); renderModalCalendars(); }
function printSelectNone() { printSelected = new Set(); renderModalCalendars(); }

function doPrint() {
  const orderedPrintDates = allDates.filter(d => printSelected.has(d));
  document.querySelectorAll('.day-block').forEach(el => {
    const d = el.dataset.date;
    const isFirstPrinted = d === orderedPrintDates[0];
    el.classList.toggle('print-exclude', !printSelected.has(d));
    el.classList.toggle('page-break-before', printSelected.has(d) && !isFirstPrinted);
  });
  closePrintModal();
  window.print();
}

// ---------- Day detail rendering (always all days, continuous) ----------
function badgeFor(val, min, max) {
  if (val < min) return 'badge-low';
  if (val > max) return 'badge-high';
  return 'badge-ok';
}
function badgeText(val, min, max) {
  if (val < min) return 'LOW';
  if (val > max) return 'HIGH';
  return 'OK';
}
function formatDate(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function renderDayList() {
  const container = document.getElementById('dayList');
  container.innerHTML = '';

  allDates.forEach(dateStr => {
    const day = DATA[dateStr];
    const block = document.createElement('div');
    block.className = 'day-block';
    block.dataset.date = dateStr;

    const calDot = 'dot-' + badgeFor(day.totals.cal, GOALS.cal.min, GOALS.cal.max).replace('badge-', '');
    let html = `<div class="day-block-header"><h3 class="day-date">${formatDate(dateStr)}</h3><span class="cal-badge">${day.totals.cal.toFixed(0)} kcal<span class="metric-dot ${calDot}"></span></span></div>`;
    if (day.had_duplicates) {
      html += `<p class="day-note">Duplicate log entries for this day were detected and removed before totals were computed.</p>`;
    }

    day.meals.forEach(m => {
      html += `<div class="meal-group">`;
      html += `<div class="meal-label">Meal ${m.meal}<span class="meal-cal">${m.meal_cal.toFixed(0)} kcal</span></div>`;
      html += `<div class="meal-items">`;
      m.items.forEach(it => {
        html += `<div class="item-row"><span class="item-name">${it.name}</span><span class="item-meta">${it.grams.toFixed(0)}g &middot; ${it.cal.toFixed(0)} kcal</span></div>`;
      });
      html += `</div></div>`;
    });

    function metricCell(label, val, unit, min, max) {
      const dot = 'dot-' + badgeFor(val, min, max).replace('badge-', '');
      const displayVal = (typeof val === 'number' && unit !== '%') ? val.toFixed(1) : val;
      return `
        <div class="metric-cell">
          <div class="metric-label">${label}</div>
          <div class="metric-value">${displayVal}${unit}<span class="metric-dot ${dot}"></span></div>
          <div class="metric-target">${min}&ndash;${max}${unit}</div>
        </div>`;
    }

    const pct = computeMacroPercents(day.totals);

    html += `<div class="summary-compact">`;
    html += `<div class="summary-row">`;
    html += metricCell('Fat', day.totals.fat, 'g', GOALS.fat.min, GOALS.fat.max);
    html += metricCell('Carbs', day.totals.carb, 'g', GOALS.carb.min, GOALS.carb.max);
    html += metricCell('Fiber', day.totals.fiber, 'g', GOALS.fiber.min, GOALS.fiber.max);
    html += metricCell('Protein', day.totals.protein, 'g', GOALS.protein.min, GOALS.protein.max);
    html += `</div>`;
    html += `<div class="summary-row">`;
    html += metricCell('Sodium', day.totals.sodium, 'mg', GOALS.sodium.min, GOALS.sodium.max);
    html += metricCell('Fat (% Cal.)', pct.fat, '%', PCT_GOALS.fat.min, PCT_GOALS.fat.max);
    html += metricCell('Carbs (% Cal.)', pct.carb, '%', PCT_GOALS.carb.min, PCT_GOALS.carb.max);
    html += metricCell('Protein (% Cal.)', pct.protein, '%', PCT_GOALS.protein.min, PCT_GOALS.protein.max);
    html += `</div>`;
    html += `</div>`;

    block.innerHTML = html;
    container.appendChild(block);
  });
}

renderDayList();
renderNavCalendars();
setupScrollspy();

// Land on the most recent logged day by default -- this is always the
// same day the email's summary was drawn from, so no URL parameter or
// generation-time tagging is needed at all.
//
// Wait for fonts to finish loading (and one extra animation frame for
// layout to settle) before scrolling -- calling scrollIntoView() before
// the page's true height is established can get silently overridden
// by a later layout shift, with no error thrown.
if (allDates.length > 0) {
  const targetDate = allDates[allDates.length - 1];
  const doScroll = () => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => scrollToDay(targetDate, true));
    });
  };
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(doScroll);
  } else {
    doScroll();
  }
}
